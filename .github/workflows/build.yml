name: build-apk

on:
  push:
    branches: ['app/**']

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create project and build APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          {
            set -e
            J=$GITHUB_WORKSPACE/src/app.json
            NAME=$(jq -r '.appName // "My App"' "$J")
            APP_ID=$(jq -r '.appId // "com.aibuilder.app"' "$J")
            VERSION=$(jq -r '(.version // 1) | tonumber' "$J")
            SPLASH_COLOR=$(jq -r '.splashColor // "#FFFFFF"' "$J")
            SPLASH_ON=$(jq -r '.splash // false' "$J")
            echo "App: $NAME | id: $APP_ID | version: $VERSION"
            flutter --version
            flutter create --org com.aibuilder --project-name app --platforms android,web build_app
            rm -rf build_app/lib
            cp -r src/lib build_app/lib
            cd build_app
            # SDK packages (not on pub.dev) used by the generated code
            if grep -rqs "package:flutter_localizations/" lib; then flutter pub add flutter_localizations --sdk=flutter; fi
            if [ -s ../src/deps.txt ]; then
              while IFS= read -r d || [ -n "$d" ]; do
                d=$(echo "$d" | tr -d '\r' | xargs)
                [ -n "$d" ] && flutter pub add "$d"
              done < ../src/deps.txt
            fi

            # app name + permissions
            M=android/app/src/main/AndroidManifest.xml
            SAFE_NAME=$(printf '%s' "$NAME" | sed 's/[&|"<>\\]/ /g')
            sed -i "s|android:label=\"app\"|android:label=\"$SAFE_NAME\"|" "$M"
            if [ -s ../src/permissions.txt ]; then
              while IFS= read -r p || [ -n "$p" ]; do
                p=$(echo "$p" | tr -d '\r' | xargs)
                [ -n "$p" ] && sed -i "s|<application|<uses-permission android:name=\"$p\"/>\n    <application|" "$M"
              done < ../src/permissions.txt
            fi

            # unique application id: same id across versions => new versions install as updates
            G=android/app/build.gradle.kts
            grep -q 'applicationId = "com.aibuilder.app"' "$G" || { echo "applicationId line not found"; exit 1; }
            sed -i "s|applicationId = \"com.aibuilder.app\"|applicationId = \"$APP_ID\"|" "$G"

            # fixed release signing key (stored in repo secrets)
            if [ -n "$KEYSTORE_B64" ]; then
              echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
              python3 "$GITHUB_WORKSPACE/.github/scripts/patch_signing.py"
            else
              echo "WARNING: KEYSTORE_B64 secret missing - using debug key"
            fi

            # usage stats + in-app update notice (native, independent from the generated Dart code)
            TELEMETRY=$(jq -r 'if .telemetry == false then "false" else "true" end' "$J")
            UPDATES=$(jq -r 'if .updateCheck == false then "false" else "true" end' "$J")
            PING_URL=$(jq -r '.pingUrl // ""' "$J")
            if [[ "$PING_URL" =~ ^https://[A-Za-z0-9._/-]+$ ]] && { [ "$TELEMETRY" = true ] || [ "$UPDATES" = true ]; }; then
              MA=$(find android/app/src/main -name MainActivity.kt | head -1)
              [ -n "$MA" ] || { echo "MainActivity.kt not found"; exit 1; }
              cp "$GITHUB_WORKSPACE/.github/scripts/MainActivity.kt.tpl" "$MA"
              sed -e "s|__ENDPOINT__|$PING_URL|" -e "s|__APP_ID__|$APP_ID|" -e "s|__TELEMETRY__|$TELEMETRY|" -e "s|__UPDATES__|$UPDATES|" \
                "$GITHUB_WORKSPACE/.github/scripts/AibAgent.kt.tpl" > "$(dirname "$MA")/AibAgent.kt"
              echo "Agent added: telemetry=$TELEMETRY updates=$UPDATES"
            fi

            # optional launcher icon
            if [ -s ../src/icon.b64 ]; then
              mkdir -p assets/branding
              base64 -d ../src/icon.b64 > assets/branding/icon.png
              flutter pub add dev:flutter_launcher_icons
              printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/branding/icon.png"\n  min_sdk_android: 21\n  web:\n    generate: true\n    image_path: "assets/branding/icon.png"\n    background_color: "%s"\n    theme_color: "%s"\n' "$SPLASH_COLOR" "$SPLASH_COLOR" > flutter_launcher_icons.yaml
              dart run flutter_launcher_icons
            fi

            # optional splash screen (image and/or background color)
            if [ -s ../src/splash.b64 ] || [ "$SPLASH_ON" = "true" ]; then
              flutter pub add dev:flutter_native_splash
              HAS_IMG=0
              if [ -s ../src/splash.b64 ]; then
                mkdir -p assets/branding
                base64 -d ../src/splash.b64 > assets/branding/splash.png
                HAS_IMG=1
              fi
              {
                echo "flutter_native_splash:"
                echo "  color: \"$SPLASH_COLOR\""
                echo "  android: true"
                echo "  ios: false"
                echo "  web: true"
                [ $HAS_IMG = 1 ] && echo "  image: assets/branding/splash.png"
                echo "  android_12:"
                echo "    color: \"$SPLASH_COLOR\""
                [ $HAS_IMG = 1 ] && echo "    image: assets/branding/splash.png"
                true
              } > flutter_native_splash.yaml
              dart run flutter_native_splash:create
            fi

            flutter pub get
            flutter build apk --release --target-platform android-arm64 --build-number=$VERSION --build-name=1.0.$VERSION
          } 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

      - name: Build iPhone web version
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -e
          J=$GITHUB_WORKSPACE/src/app.json
          [ "$(jq -r 'if .web == false then "false" else "true" end' "$J")" = true ] || { echo "web version disabled"; exit 0; }
          APP_ID=$(jq -r '.appId // "com.aibuilder.app"' "$J")
          TEL=$(jq -r 'if .telemetry == false then "false" else "true" end' "$J")
          cd build_app
          python3 "$GITHUB_WORKSPACE/.github/scripts/prepare_web.py" "$J" "$TEL"
          flutter build web --release --base-href "/ai-apps-web/$APP_ID/" --no-web-resources-cdn \
            || flutter build web --release --base-href "/ai-apps-web/$APP_ID/"
          rm -rf "$GITHUB_WORKSPACE/web_out" && cp -r build/web "$GITHUB_WORKSPACE/web_out"
          touch "$GITHUB_WORKSPACE/web_ok"

      - name: Publish iPhone web version
        if: success()
        continue-on-error: true
        shell: bash
        env:
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
        run: |
          set -e
          [ -f web_ok ] || { echo "no web build"; exit 0; }
          [ -n "$WEB_DEPLOY_TOKEN" ] || { echo "WEB_DEPLOY_TOKEN missing"; exit 0; }
          OWNER=${GITHUB_REPOSITORY%%/*}
          APP_ID=$(jq -r '.appId // "com.aibuilder.app"' src/app.json)
          VERSION=$(jq -r '(.version // 1) | tonumber' src/app.json)
          git clone --depth 1 "https://x-access-token:${WEB_DEPLOY_TOKEN}@github.com/$OWNER/ai-apps-web.git" pages
          rm -rf "pages/$APP_ID" && mkdir -p "pages/$APP_ID" && cp -r web_out/. "pages/$APP_ID/"
          cd pages
          git config user.name "AI App Builder"
          git config user.email "ai-app-builder@users.noreply.github.com"
          git add -A
          git commit -qm "Publish $APP_ID v$VERSION" || true
          for i in 1 2 3 4; do git push -q && break; sleep 3; git pull -q --rebase; done
          echo "https://$OWNER.github.io/ai-apps-web/$APP_ID/" > "$GITHUB_WORKSPACE/web_url"
          echo "published: $(cat "$GITHUB_WORKSPACE/web_url")"

      - name: Save to my apps (release with APK + source)
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-${GITHUB_REF_NAME#app/}"
          NAME=$(jq -r '(.appName // "My App") + (if ((.version // 1) | tonumber) > 1 then " — الإصدار \(.version)" else "" end)' src/app.json)
          jq -r '(.summary // "") + "\n\n---\n" + (.description // "")
            + (if (.history // "") != "" then "\n\nسجل التعديلات:\n" + .history else "" end)
            + (if (.discussion // "") != "" then "\n\nملخص النقاش:\n" + .discussion else "" end)
            + "\n\n<!--aib " + ({appId: (.appId // ""), version: ((.version // 1) | tonumber), force: (.forceUpdate == true), updates: (.updateCheck != false), telemetry: (.telemetry != false), web: $web} | tojson) + "-->"' --arg web "$(cat web_url 2>/dev/null || true)" src/app.json > notes.md
          cp build_app/build/app/outputs/flutter-apk/app-release.apk "app-${TAG}.apk"
          (cd build_app && zip -qr "../source-${TAG}.zip" . -x 'build/*' 'android/app/upload-keystore.jks' '.dart_tool/*' '.idea/*' 'android/.gradle/*' 'android/app/build/*' '*.iml' '.flutter-plugins*')
          gh release create "$TAG" "app-${TAG}.apk" "source-${TAG}.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$NAME" --notes-file notes.md \
          || gh release upload "$TAG" "app-${TAG}.apk" "source-${TAG}.zip" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
