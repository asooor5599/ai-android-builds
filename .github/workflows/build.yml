name: build-apk

on:
  push:
    branches: ['app/**']

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create project and build APK
        shell: bash
        run: |
          set -o pipefail
          {
            set -e
            NAME=$(jq -r '.appName // "My App"' src/app.json)
            flutter --version
            flutter create --org com.aibuilder --project-name app --platforms android build_app
            rm -rf build_app/lib
            cp -r src/lib build_app/lib
            [ -d src/assets ] && cp -r src/assets build_app/assets || true
            cd build_app
            if [ -s ../src/deps.txt ]; then
              while IFS= read -r d || [ -n "$d" ]; do
                d=$(echo "$d" | tr -d '\r' | xargs)
                [ -n "$d" ] && flutter pub add "$d"
              done < ../src/deps.txt
            fi
            M=android/app/src/main/AndroidManifest.xml
            SAFE_NAME=$(printf '%s' "$NAME" | sed 's/[&|"<>\\]/ /g')
            sed -i "s|android:label=\"app\"|android:label=\"$SAFE_NAME\"|" "$M"
            if [ -s ../src/permissions.txt ]; then
              while IFS= read -r p || [ -n "$p" ]; do
                p=$(echo "$p" | tr -d '\r' | xargs)
                [ -n "$p" ] && sed -i "s|<application|<uses-permission android:name=\"$p\"/>\n    <application|" "$M"
              done < ../src/permissions.txt
            fi
            flutter pub get
            flutter build apk --release
          } 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
